<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 당첨번호 분석 추첨기</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div id="app" class="min-h-screen"></div>

  <script>
    const CONFIG = {
      recentDrawCount: null,
      localJsonPath: './lotto-history.json',
      gameCount: 5,
      numbersPerGame: 6,
      recentWindow: 100,
      snapshotKey: 'lotto-recommendation-snapshot-v3'
    };

    const state = {
      draws: [],
      analysis: null,
      recommendations: [],
      previousSnapshot: null,
      revealedCount: 0,
      isFinished: false,
      error: null,
      source: null,
      updatedAt: null
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function loadDraws() {
      const response = await fetch(CONFIG.localJsonPath, { cache: 'no-store' });

      if (!response.ok) {
        throw new Error('lotto-history.json을 불러오지 못했습니다. GitHub Actions가 먼저 실행되어야 합니다.');
      }

      const data = await response.json();

      if (!Array.isArray(data.draws) || data.draws.length === 0) {
        throw new Error('lotto-history.json에 분석 가능한 회차 데이터가 없습니다.');
      }

      return {
        draws: data.draws
          .slice()
          .sort((a, b) => b.drawNo - a.drawNo)
          .slice(0, CONFIG.recentDrawCount || undefined),
        source: typeof data.source === 'string' ? data.source : JSON.stringify(data.source || ''),
        updatedAt: data.updatedAt || null
      };
    }

    function analyzeData(draws) {
      const allFrequencies = {};
      const recentFrequencies = {};
      const lastSeen = {};

      for (let i = 1; i <= 45; i += 1) {
        allFrequencies[i] = 0;
        recentFrequencies[i] = 0;
        lastSeen[i] = null;
      }

      draws.forEach((draw, index) => {
        draw.numbers.forEach((num) => {
          allFrequencies[num] += 1;

          if (index < CONFIG.recentWindow) {
            recentFrequencies[num] += 1;
          }

          if (lastSeen[num] === null) {
            lastSeen[num] = index;
          }
        });
      });

      const all = Object.keys(allFrequencies).map((num) => {
        const n = Number(num);

        return {
          num: n,
          allCount: allFrequencies[n],
          recentCount: recentFrequencies[n],
          lastSeenGap: lastSeen[n] === null ? draws.length : lastSeen[n]
        };
      });

      const sortedByAll = [...all].sort((a, b) => b.allCount - a.allCount || a.num - b.num);
      const sortedByRecent = [...all].sort((a, b) => b.recentCount - a.recentCount || a.num - b.num);
      const sortedByGap = [...all].sort((a, b) => b.lastSeenGap - a.lastSeenGap || a.num - b.num);

      return {
        all,
        hot: sortedByAll.slice(0, 15).map((item) => ({ num: item.num, count: item.allCount })),
        mid: sortedByAll.slice(15, 30).map((item) => ({ num: item.num, count: item.allCount })),
        cold: sortedByAll.slice(30, 45).map((item) => ({ num: item.num, count: item.allCount })),
        recentHot: sortedByRecent.slice(0, 15),
        recentCold: sortedByRecent.slice(30, 45),
        longAbsent: sortedByGap.slice(0, 15),
        allFrequencies,
        recentFrequencies,
        lastSeen,
        latestDraw: draws[0]
      };
    }

    function shuffleArray(array) {
      const copied = [...array];

      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }

      return copied;
    }

    function getNumberBand(num) {
      if (num <= 10) return '1-10';
      if (num <= 20) return '11-20';
      if (num <= 30) return '21-30';
      if (num <= 40) return '31-40';
      return '41-45';
    }

    function getSetStats(numbers) {
      const sorted = [...numbers].sort((a, b) => a - b);
      const sum = sorted.reduce((acc, num) => acc + num, 0);
      const oddCount = sorted.filter((num) => num % 2 === 1).length;
      const evenCount = sorted.length - oddCount;
      const bands = new Set(sorted.map(getNumberBand)).size;

      let consecutivePairs = 0;

      for (let i = 1; i < sorted.length; i += 1) {
        if (sorted[i] - sorted[i - 1] === 1) {
          consecutivePairs += 1;
        }
      }

      return {
        sum,
        oddCount,
        evenCount,
        bands,
        consecutivePairs
      };
    }

    function pickWeighted(items, weightFn, count, blockedNumbers = new Set()) {
      const selected = new Set();
      const pool = items.filter((item) => !blockedNumbers.has(item.num));

      while (selected.size < count && pool.length > 0) {
        const weighted = pool.map((item) => ({
          item,
          weight: Math.max(1, weightFn(item))
        }));

        const totalWeight = weighted.reduce((acc, row) => acc + row.weight, 0);
        let cursor = Math.random() * totalWeight;
        let pickedIndex = 0;

        for (let i = 0; i < weighted.length; i += 1) {
          cursor -= weighted[i].weight;

          if (cursor <= 0) {
            pickedIndex = i;
            break;
          }
        }

        const picked = weighted[pickedIndex].item;
        selected.add(picked.num);

        const removeIndex = pool.findIndex((item) => item.num === picked.num);
        if (removeIndex >= 0) pool.splice(removeIndex, 1);
      }

      return Array.from(selected);
    }

    function fillToSix(numbers, analysis, blockedNumbers = new Set()) {
      const selected = new Set(numbers);
      const pool = shuffleArray(analysis.all);

      for (const item of pool) {
        if (selected.size >= 6) break;
        if (!blockedNumbers.has(item.num)) selected.add(item.num);
      }

      if (selected.size < 6) {
        for (let i = 1; i <= 45; i += 1) {
          if (selected.size >= 6) break;
          selected.add(i);
        }
      }

      return Array.from(selected).sort((a, b) => a - b);
    }

    function createCandidate(analysis, mode) {
      const latestNumbers = new Set(analysis.latestDraw?.numbers || []);

      if (mode === 'analysis') {
        const picked = pickWeighted(
          analysis.all,
          (item) => item.allCount * 2 + item.recentCount,
          6
        );

        return fillToSix(picked, analysis);
      }

      if (mode === 'recent') {
        const picked = pickWeighted(
          analysis.all,
          (item) => item.recentCount * 3 + item.allCount * 0.4,
          6
        );

        return fillToSix(picked, analysis);
      }

      if (mode === 'avoidLast') {
        const picked = pickWeighted(
          analysis.all,
          (item) => item.allCount + item.lastSeenGap * 1.2 + item.recentCount,
          6,
          latestNumbers
        );

        return fillToSix(picked, analysis, latestNumbers);
      }

      if (mode === 'spread') {
        const selected = new Set();
        const bands = [
          analysis.all.filter((item) => item.num <= 10),
          analysis.all.filter((item) => item.num >= 11 && item.num <= 20),
          analysis.all.filter((item) => item.num >= 21 && item.num <= 30),
          analysis.all.filter((item) => item.num >= 31 && item.num <= 40),
          analysis.all.filter((item) => item.num >= 41 && item.num <= 45)
        ];

        shuffleArray(bands).forEach((band) => {
          const picked = pickWeighted(
            band,
            (item) => item.allCount * 0.5 + item.recentCount + item.lastSeenGap * 0.4,
            1
          )[0];

          if (picked) selected.add(picked);
        });

        return fillToSix(Array.from(selected), analysis);
      }

      if (mode === 'random') {
        const allNumbers = Array.from({ length: 45 }, (_, index) => index + 1);
        return shuffleArray(allNumbers).slice(0, 6).sort((a, b) => a - b);
      }

      const fallback = shuffleArray(analysis.all).slice(0, 6).map((item) => item.num);
      return fallback.sort((a, b) => a - b);
    }

    function getSetScore(numbers, analysis, mode, existingGames) {
      const stats = getSetStats(numbers);
      const latestNumbers = analysis.latestDraw?.numbers || [];

      const allFrequencyScore = numbers.reduce((acc, num) => acc + (analysis.allFrequencies[num] || 0), 0);
      const recentFrequencyScore = numbers.reduce((acc, num) => acc + (analysis.recentFrequencies[num] || 0), 0);
      const gapScore = numbers.reduce((acc, num) => acc + Math.min(analysis.lastSeen[num] || 0, 30), 0);
      const latestOverlap = numbers.filter((num) => latestNumbers.includes(num)).length;

      const sumPenalty = stats.sum < 95 || stats.sum > 190 ? 18 : 0;
      const oddPenalty = stats.oddCount < 2 || stats.oddCount > 4 ? 14 : 0;
      const consecutivePenalty = stats.consecutivePairs > 1 ? 14 : 0;
      const bandBonus = stats.bands * 5;

      const similarityPenalty = existingGames.some((game) => {
        const overlap = numbers.filter((num) => game.numbers.includes(num)).length;
        return overlap >= 3;
      }) ? 60 : 0;

      if (mode === 'analysis') {
        return allFrequencyScore * 1.5 + recentFrequencyScore * 0.5 + bandBonus - sumPenalty - oddPenalty - consecutivePenalty - similarityPenalty;
      }

      if (mode === 'recent') {
        return recentFrequencyScore * 2.4 + allFrequencyScore * 0.3 + bandBonus - sumPenalty - oddPenalty - consecutivePenalty - similarityPenalty;
      }

      if (mode === 'avoidLast') {
        return allFrequencyScore * 0.7 + gapScore * 1.6 + bandBonus - latestOverlap * 50 - sumPenalty - oddPenalty - consecutivePenalty - similarityPenalty;
      }

      if (mode === 'spread') {
        return bandBonus * 4 + recentFrequencyScore * 0.7 + allFrequencyScore * 0.2 - sumPenalty * 1.5 - oddPenalty * 1.5 - consecutivePenalty * 2 - similarityPenalty;
      }

      if (mode === 'random') {
        return bandBonus * 1.4 - sumPenalty - oddPenalty - consecutivePenalty - latestOverlap * 10 - similarityPenalty * 0.5;
      }

      return allFrequencyScore + bandBonus - sumPenalty - oddPenalty - consecutivePenalty - similarityPenalty;
    }

    function generateBestSet(analysis, mode, existingGames, attempts = 700) {
      let bestSet = null;
      let bestScore = -Infinity;

      for (let i = 0; i < attempts; i += 1) {
        const candidate = createCandidate(analysis, mode);

        if (candidate.length !== 6) continue;
        if (new Set(candidate).size !== 6) continue;

        const score = getSetScore(candidate, analysis, mode, existingGames);

        if (score > bestScore) {
          bestSet = candidate;
          bestScore = score;
        }
      }

      return bestSet;
    }

    function generateRecommendations(analysis) {
      const games = [];

      const plans = [
        {
          label: 'A 분석형',
          subtitle: '전회차 빈도 중심',
          description: '전체 회차에서 많이 나온 번호 흐름을 가장 강하게 반영합니다.',
          mode: 'analysis'
        },
        {
          label: 'B 최근형',
          subtitle: `최근 ${CONFIG.recentWindow}회 흐름`,
          description: '최근 흐름에 더 민감하게 반응하는 조합입니다.',
          mode: 'recent'
        },
        {
          label: 'C 회피형',
          subtitle: '직전 회차 겹침 최소화',
          description: '직전 당첨번호와의 겹침을 강하게 줄인 조합입니다.',
          mode: 'avoidLast'
        },
        {
          label: 'D 분산형',
          subtitle: '구간·홀짝·합계 분산',
          description: '번호대가 한쪽에 몰리지 않도록 퍼뜨린 조합입니다.',
          mode: 'spread'
        },
        {
          label: 'E 랜덤형',
          subtitle: '분석 가중치 낮음',
          description: '복권다운 의외성을 살리기 위해 거의 무작위에 가깝게 생성합니다.',
          mode: 'random'
        }
      ];

      plans.forEach((plan) => {
        const numbers = generateBestSet(analysis, plan.mode, games);

        if (Array.isArray(numbers) && numbers.length === 6) {
          games.push({
            ...plan,
            numbers
          });
        }
      });

      return games;
    }

    function loadPreviousSnapshot() {
      try {
        const raw = localStorage.getItem(CONFIG.snapshotKey);
        if (!raw) return null;

        const parsed = JSON.parse(raw);

        if (!parsed || !Array.isArray(parsed.games)) return null;
        return parsed;
      } catch (_) {
        return null;
      }
    }

    function saveCurrentSnapshot() {
      if (!state.draws[0] || !state.recommendations.length) return;

      const snapshot = {
        savedAt: new Date().toISOString(),
        basedOnLatestDrawNo: state.draws[0].drawNo,
        games: state.recommendations.map((game) => ({
          label: game.label,
          subtitle: game.subtitle,
          numbers: game.numbers
        }))
      };

      localStorage.setItem(CONFIG.snapshotKey, JSON.stringify(snapshot));
      state.previousSnapshot = snapshot;
      renderApp();
    }

    function getSnapshotResult() {
      const snapshot = state.previousSnapshot;
      const latestDraw = state.draws[0];

      if (!snapshot || !latestDraw) return null;
      if (snapshot.basedOnLatestDrawNo >= latestDraw.drawNo) return null;

      const winningNumbers = latestDraw.numbers || [];

      const rows = snapshot.games.map((game) => {
        const hits = game.numbers.filter((num) => winningNumbers.includes(num));
        const bonusHit = latestDraw.bonus && game.numbers.includes(latestDraw.bonus);

        return {
          ...game,
          hits,
          bonusHit
        };
      });

      return {
        basedOnLatestDrawNo: snapshot.basedOnLatestDrawNo,
        latestDrawNo: latestDraw.drawNo,
        latestDraw,
        rows
      };
    }

    function resetDrawMachine() {
      state.recommendations = generateRecommendations(state.analysis);
      state.revealedCount = 0;
      state.isFinished = false;
      renderApp();
    }

    function revealNextNumber() {
      const totalNumbers = state.recommendations.length * CONFIG.numbersPerGame;

      if (state.revealedCount < totalNumbers) {
        state.revealedCount += 1;
        state.isFinished = state.revealedCount >= totalNumbers;
        renderApp();
      }
    }

    function revealNextGame() {
      const totalNumbers = state.recommendations.length * CONFIG.numbersPerGame;
      const nextGameEnd = Math.min(
        Math.ceil((state.revealedCount + 1) / CONFIG.numbersPerGame) * CONFIG.numbersPerGame,
        totalNumbers
      );

      state.revealedCount = nextGameEnd;
      state.isFinished = state.revealedCount >= totalNumbers;
      renderApp();
    }

    function getBallClass(num) {
      if (num <= 10) return 'bg-yellow-400 text-yellow-950 border-yellow-500';
      if (num <= 20) return 'bg-blue-400 text-blue-950 border-blue-500';
      if (num <= 30) return 'bg-red-400 text-red-950 border-red-500';
      if (num <= 40) return 'bg-slate-400 text-slate-950 border-slate-500';
      return 'bg-green-400 text-green-950 border-green-500';
    }

    function formatUpdatedAt(value) {
      if (!value) return '확인 불가';

      try {
        const date = new Date(value);
        return new Intl.DateTimeFormat('ko-KR', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      } catch (_) {
        return value;
      }
    }

    function renderLoading() {
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen flex-col items-center justify-center bg-slate-50 p-6 text-center text-slate-700">
          <div class="mb-4 h-12 w-12 animate-spin rounded-full border-4 border-indigo-100 border-t-indigo-600"></div>
          <p class="text-lg font-medium">전회차 당첨번호를 불러오는 중입니다...</p>
          <p class="mt-2 text-sm text-slate-500">GitHub Actions가 생성한 lotto-history.json을 읽고 있습니다.</p>
        </div>
      `;
    }

    function renderError(message) {
      document.getElementById('app').innerHTML = `
        <div class="flex min-h-screen flex-col items-center justify-center bg-slate-50 p-6 text-center text-slate-700">
          <div class="mb-4 text-5xl">⚠</div>
          <h1 class="mb-2 text-xl font-bold text-slate-900">데이터 로딩 실패</h1>
          <p class="mb-6 max-w-xl text-sm leading-relaxed text-slate-500">${escapeHtml(message)}</p>

          <div class="max-w-xl rounded-2xl border border-amber-200 bg-amber-50 p-4 text-left text-sm leading-relaxed text-amber-900">
            저장소에 <code class="rounded bg-amber-100 px-1">lotto-history.json</code>이 없으면 이 화면은 데이터를 표시할 수 없습니다.
            GitHub Actions의 <strong>Update Lotto History</strong> 워크플로우를 한 번 수동 실행한 뒤 다시 열어주세요.
          </div>

          <button id="retryButton" class="mt-6 rounded-xl bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700">다시 시도</button>
        </div>
      `;

      document.getElementById('retryButton').addEventListener('click', init);
    }

    function renderNumberTags(items, color) {
      const colorMap = {
        red: 'border-red-100 bg-red-50 text-red-700',
        green: 'border-green-100 bg-green-50 text-green-700',
        blue: 'border-blue-100 bg-blue-50 text-blue-700'
      };

      return items.map((item) => `
        <span class="rounded-md border ${colorMap[color]} px-2 py-1 text-xs">
          ${item.num} (${item.count}회)
        </span>
      `).join('');
    }

    function renderRecentDraws(draws) {
      return draws.slice(0, 5).map((draw) => `
        <div class="text-sm text-slate-600">
          <div class="font-semibold text-slate-800">${draw.drawNo}회${draw.date ? ` · ${draw.date}` : ''}</div>
          <div class="mt-1">${draw.numbers.join(', ')}${draw.bonus ? ` + 보너스 ${draw.bonus}` : ''}</div>
        </div>
      `).join('');
    }

    function renderSnapshotResult() {
      const result = getSnapshotResult();

      if (!result) {
        return `
          <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">
              <div>
                <h2 class="text-lg font-bold text-slate-900">지난 추천 검증</h2>
                <p class="mt-1 text-sm text-slate-500">
                  다음 회차 데이터가 업데이트되면 이전 추천이 몇 개 맞았는지 이곳에 표시됩니다.
                </p>
              </div>
              <button
                id="saveSnapshotButton"
                class="rounded-xl border border-indigo-200 bg-indigo-50 px-4 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-100"
              >
                이번 추천 저장
              </button>
            </div>
          </section>
        `;
      }

      return `
        <section class="rounded-2xl border border-rose-100 bg-white p-6 shadow-sm">
          <div class="flex flex-col justify-between gap-4 md:flex-row md:items-start">
            <div>
              <h2 class="text-lg font-bold text-slate-900">지난 추천 검증</h2>
              <p class="mt-1 text-sm text-slate-500">
                ${result.basedOnLatestDrawNo}회 기준 추천을 ${result.latestDrawNo}회 당첨번호와 비교했습니다.
              </p>
              <p class="mt-2 text-sm font-semibold text-slate-700">
                ${result.latestDrawNo}회 당첨번호: ${result.latestDraw.numbers.join(', ')}${result.latestDraw.bonus ? ` + 보너스 ${result.latestDraw.bonus}` : ''}
              </p>
            </div>

            <button
              id="saveSnapshotButton"
              class="rounded-xl border border-indigo-200 bg-indigo-50 px-4 py-2 text-sm font-semibold text-indigo-700 hover:bg-indigo-100"
            >
              이번 추천으로 갱신 저장
            </button>
          </div>

          <div class="mt-5 grid grid-cols-1 gap-3 md:grid-cols-5">
            ${result.rows.map((row) => `
              <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
                <div class="text-sm font-bold text-slate-900">${escapeHtml(row.label)}</div>
                <div class="mt-1 text-xs text-slate-500">${escapeHtml(row.subtitle || '')}</div>
                <div class="mt-3 text-sm font-semibold ${row.hits.length >= 3 ? 'text-rose-600' : 'text-slate-600'}">
                  ${row.hits.length}개 적중${row.bonusHit ? ' + 보너스' : ''}
                </div>
                <div class="mt-2 text-xs text-slate-400">
                  ${row.hits.length ? row.hits.join(', ') : '적중 없음'}
                </div>
              </div>
            `).join('')}
          </div>
        </section>
      `;
    }

    function getRevealMeta() {
      const totalNumbers = state.recommendations.length * CONFIG.numbersPerGame;

      return {
        totalNumbers,
        progressPercent: totalNumbers ? Math.round((state.revealedCount / totalNumbers) * 100) : 0
      };
    }

    function renderDrawMachine() {
      const meta = getRevealMeta();

      return `
        <div class="rounded-2xl border border-indigo-100 bg-gradient-to-br from-white to-indigo-50 p-6 shadow-sm">
          <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">
            <div>
              <h2 class="text-xl font-bold text-slate-900">로또 추첨기</h2>
              <p class="mt-1 text-sm text-slate-500">
                버튼을 누를 때마다 번호가 하나씩 공개됩니다. 분석형 2게임, 변주형 3게임입니다.
              </p>
            </div>
            <div class="rounded-full bg-white px-4 py-2 text-sm font-semibold text-indigo-700 shadow-sm">
              ${state.isFinished ? '추첨 완료' : `${state.revealedCount} / ${meta.totalNumbers}개 공개`}
            </div>
          </div>

          <div class="mt-6 h-3 overflow-hidden rounded-full bg-indigo-100">
            <div class="h-full rounded-full bg-indigo-600 transition-all duration-300" style="width: ${meta.progressPercent}%"></div>
          </div>

          <div class="mt-6 flex flex-col gap-3 sm:flex-row">
            <button
              id="revealNextButton"
              class="flex-1 rounded-2xl bg-indigo-600 px-6 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300"
              ${state.isFinished ? 'disabled' : ''}
            >
              ${state.revealedCount === 0 ? '추첨 시작' : state.isFinished ? '추첨 완료' : '번호 하나 뽑기'}
            </button>

            <button
              id="revealGameButton"
              class="rounded-2xl border border-indigo-200 bg-white px-5 py-4 font-semibold text-indigo-700 transition hover:bg-indigo-50 disabled:cursor-not-allowed disabled:border-slate-200 disabled:text-slate-300"
              ${state.isFinished ? 'disabled' : ''}
            >
              한 게임 한번에 보기
            </button>

            <button
              id="resetButton"
              class="rounded-2xl border border-slate-200 bg-white px-5 py-4 font-semibold text-slate-700 transition hover:bg-slate-50"
            >
              새로 뽑기
            </button>
          </div>
        </div>
      `;
    }

    function renderRecommendationGames() {
      return state.recommendations.map((game, gameIndex) => {
        const set = game.numbers;
        const gameStartIndex = gameIndex * CONFIG.numbersPerGame;
        const visibleNumbers = Math.max(0, Math.min(CONFIG.numbersPerGame, state.revealedCount - gameStartIndex));
        const isCurrentGame = visibleNumbers > 0 && visibleNumbers < CONFIG.numbersPerGame;
        const isComplete = visibleNumbers === CONFIG.numbersPerGame;

        return `
          <div class="rounded-2xl border ${isCurrentGame ? 'border-indigo-300 bg-indigo-50' : 'border-slate-200 bg-slate-50'} p-5 transition-all">
            <div class="mb-4 flex items-start justify-between gap-3">
              <div class="flex items-start gap-3">
                <span class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full ${isComplete ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500'} text-sm font-bold shadow-sm">
                  ${gameIndex + 1}
                </span>

                <div>
                  <h3 class="font-bold text-slate-900">${escapeHtml(game.label)}</h3>
                  <p class="mt-0.5 text-xs font-semibold text-indigo-600">${escapeHtml(game.subtitle)}</p>
                  <p class="mt-1 text-xs leading-relaxed text-slate-500">${escapeHtml(game.description)}</p>
                </div>
              </div>

              <span class="whitespace-nowrap text-xs font-semibold ${isComplete ? 'text-indigo-600' : 'text-slate-400'}">
                ${isComplete ? '완성' : `${visibleNumbers} / ${CONFIG.numbersPerGame}`}
              </span>
            </div>

            <div class="grid grid-cols-6 gap-2">
              ${set.map((num, numberIndex) => {
                const isVisible = numberIndex < visibleNumbers;
                const isLatest = gameStartIndex + numberIndex + 1 === state.revealedCount;

                if (!isVisible) {
                  return `
                    <div class="flex h-11 w-11 items-center justify-center rounded-full border border-dashed border-slate-300 bg-white text-lg font-bold text-slate-300 shadow-sm md:h-12 md:w-12">
                      ?
                    </div>
                  `;
                }

                return `
                  <div class="flex h-11 w-11 items-center justify-center rounded-full border text-lg font-bold shadow-sm md:h-12 md:w-12 ${getBallClass(num)} ${isLatest ? 'scale-110 animate-pulse ring-4 ring-indigo-200' : ''}">
                    ${num}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderApp() {
      if (!state.analysis) state.analysis = analyzeData(state.draws);
      if (state.recommendations.length === 0) state.recommendations = generateRecommendations(state.analysis);

      const latestDraw = state.draws[0];
      const oldestDraw = state.draws[state.draws.length - 1];
      const totalNumbers = state.draws.length * 6;
      const expectedAverage = (totalNumbers / 45).toFixed(1);
      const updatedAtText = formatUpdatedAt(state.updatedAt);

      document.getElementById('app').innerHTML = `
        <div class="min-h-screen bg-slate-50 p-4 font-sans text-slate-800 md:p-8">
          <div class="mx-auto max-w-5xl space-y-8">
            <header class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
              <div class="flex flex-col justify-between gap-4 md:flex-row md:items-center">
                <div>
                  <h1 class="flex items-center gap-2 text-2xl font-bold text-slate-900 md:text-3xl">
                    <span class="text-indigo-600">▦</span>
                    실제 당첨번호 기반 로또 추첨기
                  </h1>
                  <p class="mt-2 text-slate-500">
                    전회차 당첨번호 ${state.draws.length}개 회차를 분석하되, 분석형·최근형·회피형·분산형·랜덤형으로 나누어 공개합니다.
                  </p>
                  <p class="mt-1 text-xs text-slate-400">데이터 출처: ${escapeHtml(state.source)}</p>
                  <p class="mt-1 text-xs text-slate-400">데이터 업데이트: ${updatedAtText}</p>
                </div>
              </div>

              <div class="mt-6 flex gap-3 rounded-r-lg border-l-4 border-amber-500 bg-amber-50 p-4 text-sm text-amber-800">
                <div class="flex-shrink-0">⚠</div>
                <div>
                  <strong>안내:</strong> 이 시스템은 지난 당첨번호의 출현 빈도를 분석하지만, 로또 추첨은 독립 시행이므로 과거 빈도가 다음 회차 당첨 확률을 보장하지 않습니다. 추천 번호는 참고용입니다.
                </div>
              </div>
            </header>

            ${renderSnapshotResult()}

            ${renderDrawMachine()}

            <div class="grid grid-cols-1 gap-8 lg:grid-cols-3">
              <aside class="space-y-6 lg:col-span-1">
                <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                  <h2 class="mb-4 flex items-center gap-2 text-lg font-bold text-slate-900">
                    <span class="text-indigo-500">ⓘ</span>
                    분석 기준
                  </h2>

                  <ul class="space-y-3 text-sm leading-relaxed text-slate-600">
                    <li>• <strong>분석 회차:</strong> ${oldestDraw.drawNo}회 ~ ${latestDraw.drawNo}회</li>
                    <li>• <strong>분석 대상:</strong> 전회차 당첨번호 (${state.draws.length}회차)</li>
                    <li>• <strong>최근 흐름:</strong> 최근 ${Math.min(CONFIG.recentWindow, state.draws.length)}회차 별도 반영</li>
                    <li>• <strong>총 분석 번호 수:</strong> ${totalNumbers}개</li>
                    <li>• <strong>평균 출현 기대치:</strong> 약 ${expectedAverage}회</li>
                    <li>• <strong class="text-red-600">Hot:</strong> 출현 빈도 상위 15개</li>
                    <li>• <strong class="text-green-600">Mid:</strong> 출현 빈도 중위 15개</li>
                    <li>• <strong class="text-blue-600">Cold:</strong> 출현 빈도 하위 15개</li>
                    <li class="border-t border-slate-100 pt-2">
                      <strong>추천 방식:</strong> 2개는 분석형, 3개는 회피·분산·랜덤 변주형입니다.
                    </li>
                  </ul>
                </section>

                <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                  <h2 class="mb-4 text-lg font-bold text-slate-900">번호 분류 결과</h2>

                  <div class="space-y-4">
                    <div>
                      <h3 class="mb-2 text-sm font-semibold text-red-600">🔥 Hot</h3>
                      <div class="flex flex-wrap gap-1.5">
                        ${renderNumberTags(state.analysis.hot, 'red')}
                      </div>
                    </div>

                    <div>
                      <h3 class="mb-2 text-sm font-semibold text-green-600">🌿 Mid</h3>
                      <div class="flex flex-wrap gap-1.5">
                        ${renderNumberTags(state.analysis.mid, 'green')}
                      </div>
                    </div>

                    <div>
                      <h3 class="mb-2 text-sm font-semibold text-blue-600">❄️ Cold</h3>
                      <div class="flex flex-wrap gap-1.5">
                        ${renderNumberTags(state.analysis.cold, 'blue')}
                      </div>
                    </div>
                  </div>
                </section>

                <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
                  <h2 class="mb-4 text-lg font-bold text-slate-900">최근 당첨번호</h2>
                  <div class="space-y-3">
                    ${renderRecentDraws(state.draws)}
                  </div>
                </section>
              </aside>

              <main class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-2">
                <div class="mb-6 border-b border-slate-100 pb-4">
                  <h2 class="text-xl font-bold text-slate-900">추천 번호 ${CONFIG.gameCount}게임</h2>
                  <p class="mt-1 text-sm text-slate-500">A·B는 분석 중심, C·D·E는 변주 중심입니다.</p>
                </div>

                <div class="grid grid-cols-1 gap-4">
                  ${renderRecommendationGames()}
                </div>

                <p class="mt-6 text-xs leading-relaxed text-slate-400">
                  과거 출현 빈도 분포를 참고한 조합 생성 결과입니다. 당첨 가능성을 보장하지 않습니다.
                </p>
              </main>
            </div>
          </div>
        </div>
      `;

      document.getElementById('revealNextButton').addEventListener('click', revealNextNumber);
      document.getElementById('revealGameButton').addEventListener('click', revealNextGame);
      document.getElementById('resetButton').addEventListener('click', resetDrawMachine);

      const saveButton = document.getElementById('saveSnapshotButton');
      if (saveButton) saveButton.addEventListener('click', saveCurrentSnapshot);
    }

    async function init() {
      renderLoading();

      try {
        const result = await loadDraws();
        state.draws = result.draws;
        state.source = result.source;
        state.updatedAt = result.updatedAt;
        state.previousSnapshot = loadPreviousSnapshot();
        state.analysis = analyzeData(state.draws);
        state.recommendations = generateRecommendations(state.analysis);
        state.revealedCount = 0;
        state.isFinished = false;
        state.error = null;

        if (!state.previousSnapshot) {
          setTimeout(() => {
            saveCurrentSnapshot();
          }, 0);
        } else {
          renderApp();
        }
      } catch (error) {
        state.error = error.message || '알 수 없는 오류가 발생했습니다.';
        renderError(state.error);
      }
    }

    init();
  </script>
</body>
</html>
